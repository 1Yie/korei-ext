name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  law:
    name: Dependency law
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Allow cargo to fetch the private korei repository
        run: |
          git config --global url."https://x-access-token:${{ secrets.KOREI_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: ./scripts/check-deps.sh

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Allow cargo to fetch the private korei repository
        run: |
          git config --global url."https://x-access-token:${{ secrets.KOREI_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: cargo test --workspace
