[package]
name = "agent-tools-office"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-tool.workspace = true
agent-capabilities = { path = "../agent-capabilities", features = ["sandbox"] }
agent-sandbox = { path = "../agent-sandbox" }
# `sandbox_cfg` and `util` are shared with the process tools rather than
# duplicated: an officecli run obeys the same mount/network policy as bash.
agent-tools-shell = { path = "../agent-tools-shell" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile = "3"
