[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
htmd = "0.5"
ignore = "0.4"
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
similar = "2"
strsim = "0.11"
toml = "0.9"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
schemars = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# Kernel closure — sibling checkout of the `korei` repository.
agent-ipc = { path = "../korei/crates/agent-ipc", version = "0.1.0" }
agent-llm-core = { path = "../korei/crates/agent-llm-core", version = "0.1.0" }
agent-tool = { path = "../korei/crates/agent-tool", version = "0.1.0" }
agent-kernel = { path = "../korei/crates/agent-kernel", version = "0.1.0" }

[profile.dev]
panic = "unwind"       # tests need unwinding; debug UX needs backtraces

# wasmtime/cranelift at opt-level 0 compile and run guests ~10x slower, which
# is what made WASM plugins hang the dev app on load and reload.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"        # no unwinding → smaller, faster; crash = process death + restart, never half-state
strip = true
debug = "line-tables-only"   # keep symbols for crash reports without full debuginfo
